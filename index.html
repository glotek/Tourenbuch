<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Touren-Inspiration</title>
  <style>
    :root {
      --bg-color: #151618;
      --card-bg: #222428;
      --accent-color: #00d2ff;
      --accent-glow: 0 0 12px rgba(0, 210, 255, 0.4);
      --text-main: #e8eaed;
      --text-muted: #9aa0a6;
      --done-bg: #1a1c1f;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }

    header {
      background-color: var(--bg-color);
      padding: 30px 20px;
      text-align: center;
      border-bottom: 1px solid rgba(0, 210, 255, 0.2);
      box-shadow: var(--accent-glow);
    }

    .logo-svg {
      width: 70px;
      height: 70px;
      fill: var(--accent-color);
      filter: drop-shadow(0 0 8px rgba(0, 210, 255, 0.6));
      margin-bottom: 15px;
    }

    h1 {
      margin: 0;
      font-size: 1.8rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .container {
      max-width: 800px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .form-card, .controls-card {
      background-color: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 25px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    input, select, textarea {
      width: 100%;
      background-color: #1b1d20;
      border: 1px solid #3a3d42;
      color: var(--text-main);
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 6px;
      box-sizing: border-box;
      font-family: inherit;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent-color);
      box-shadow: 0 0 5px rgba(0, 210, 255, 0.3);
    }

    button {
      background-color: transparent;
      color: var(--accent-color);
      border: 1px solid var(--accent-color);
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s ease;
      width: 100%;
    }

    button:hover {
      background-color: var(--accent-color);
      color: var(--bg-color);
      box-shadow: var(--accent-glow);
    }

    .tour-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .tour-item {
      background-color: var(--card-bg);
      margin-bottom: 15px;
      padding: 20px;
      border-radius: 12px;
      border-left: 4px solid var(--accent-color);
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: all 0.3s ease;
    }

    .tour-item.done {
      background-color: var(--done-bg);
      border-left-color: var(--text-muted);
      opacity: 0.85;
    }

    .tour-item.done .tour-title {
      color: var(--text-muted);
    }

    .tour-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .tour-title {
      font-size: 1.3rem;
      font-weight: bold;
      margin: 0;
    }

    .tour-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .tour-category {
      background-color: rgba(0, 210, 255, 0.1);
      color: var(--accent-color);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
    }

    .tour-item.done .tour-category {
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
    }

    .tour-notes {
      font-size: 0.95rem;
      margin-top: 5px;
      white-space: pre-wrap;
    }

    .tour-link {
      color: var(--accent-color);
      text-decoration: none;
      word-break: break-all;
    }

    .tour-link:hover {
      text-decoration: underline;
    }

    .tour-actions {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 15px;
    }

    .btn-small {
      padding: 6px 12px;
      font-size: 0.8rem;
      width: auto;
    }

    .btn-edit {
      border-color: #f39c12;
      color: #f39c12;
    }

    .btn-edit:hover {
      background-color: #f39c12;
      color: var(--bg-color);
      box-shadow: 0 0 10px rgba(243, 156, 18, 0.4);
    }

    .btn-delete {
      border-color: #ff4d4d;
      color: #ff4d4d;
    }

    .btn-delete:hover {
      background-color: #ff4d4d;
      color: white;
      box-shadow: 0 0 10px rgba(255, 77, 77, 0.4);
    }

    .filter-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    @media (max-width: 600px) {
      .filter-grid {
        grid-template-columns: 1fr;
      }
      .tour-actions {
        flex-direction: column;
      }
      .btn-small {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <header>
    <svg class="logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <mask id="cutout">
          <rect width="100" height="100" fill="white" />
          <polygon points="40,10 20,90 30,90 50,10" fill="black" />
          <polygon points="60,10 40,90 50,90 70,10" fill="black" />
          <polygon points="80,10 60,90 70,90 90,10" fill="black" />
        </mask>
      </defs>
      <polygon points="50,5 10,90 90,90" mask="url(#cutout)" />
    </svg>
    <h1>Touren-Inspiration</h1>
  </header>

  <div class="container">
    <div class="controls-card">
      <input type="text" id="searchInput" placeholder="Suche nach Tour, Region oder Material..." oninput="filterTours()">
      
      <div class="filter-grid">
        <select id="filterCategory" onchange="filterTours()">
          <option value="all">Alle Kategorien</option>
          <option value="Mehrseillängen Plaisier">Mehrseillängen Plaisier</option>
          <option value="Mehrseillängen Trad">Mehrseillängen Trad</option>
          <option value="Drytooling">Drytooling</option>
          <option value="Eisklettern">Eisklettern</option>
          <option value="Alpine Touren">Alpine Touren</option>
        </select>

        <select id="filterStatus" onchange="filterTours()">
          <option value="all">Geplant & Gemacht</option>
          <option value="planned">Nur Geplante</option>
          <option value="done">Nur Gemachte</option>
        </select>

        <button onclick="toggleForm()" id="toggleFormBtn">+ Neue Tour</button>
      </div>
    </div>

    <div class="form-card" id="tourFormContainer" style="display: none;">
      <form id="tourForm">
        <input type="text" id="tourName" placeholder="Name der Tour" required>
        <input type="text" id="tourRegion" placeholder="Region / Gebirge" required>
        
        <select id="tourCategory" required>
          <option value="" disabled selected>Kategorie wählen...</option>
          <option value="Mehrseillängen Plaisier">Mehrseillängen Plaisier</option>
          <option value="Mehrseillängen Trad">Mehrseillängen Trad</option>
          <option value="Drytooling">Drytooling</option>
          <option value="Eisklettern">Eisklettern</option>
          <option value="Alpine Touren">Alpine Touren</option>
        </select>

        <input type="url" id="tourLink" placeholder="Link zum Topo (https://...)">
        
        <textarea id="tourNotes" rows="3" placeholder="Notizen (Material, Besonderheiten, etc.)"></textarea>
        
        <button type="submit" id="submitBtn">In Cloud Speichern</button>
      </form>
    </div>

    <ul class="tour-list" id="tourList">
      <li style="text-align: center; color: var(--text-muted); padding: 20px;">Lade Touren aus der Cloud...</li>
    </ul>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy } 
    from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDi4fy0RSsvYYh_u55qj8VIokDISpA16oY",
      authDomain: "tourenbuch-51427.firebaseapp.com",
      projectId: "tourenbuch-51427",
      storageBucket: "tourenbuch-51427.firebasestorage.app",
      messagingSenderId: "1043557048178",
      appId: "1:1043557048178:web:7b659d95dab8abc4be47eb",
      measurementId: "G-Y4PVQ2Q6CD"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const toursCollection = collection(db, "tours");

    let allTours = [];
    let currentEditId = null;

    window.toggleForm = () => {
      const form = document.getElementById('tourFormContainer');
      const btn = document.getElementById('toggleFormBtn');
      if (form.style.display === 'none') {
        form.style.display = 'block';
        btn.innerText = 'Schließen';
      } else {
        form.style.display = 'none';
        btn.innerText = '+ Neue Tour';
        document.getElementById('tourForm').reset();
        currentEditId = null;
        document.getElementById('submitBtn').innerText = 'In Cloud Speichern';
      }
    };

    document.getElementById('tourForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.innerText = 'Speichert...';

      const tourData = {
        name: document.getElementById('tourName').value,
        region: document.getElementById('tourRegion').value,
        category: document.getElementById('tourCategory').value,
        link: document.getElementById('tourLink').value,
        notes: document.getElementById('tourNotes').value,
      };

      try {
        if (currentEditId) {
          const tourRef = doc(db, "tours", currentEditId);
          await updateDoc(tourRef, tourData);
          currentEditId = null;
        } else {
          tourData.isDone = false;
          tourData.doneDate = null;
          tourData.createdAt = new Date().toISOString();
          await addDoc(toursCollection, tourData);
        }
        document.getElementById('tourForm').reset();
        window.toggleForm();
      } catch (error) {
        console.error("Fehler beim Speichern: ", error);
        alert("Fehler beim Speichern. Hast du die Firestore Datenbank im Testmodus aktiviert?");
      } finally {
        submitBtn.innerText = 'In Cloud Speichern';
      }
    });

    const q = query(toursCollection, orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
      allTours = [];
      snapshot.forEach((doc) => {
        allTours.push({ id: doc.id, ...doc.data() });
      });
      renderTours();
    });

    window.toggleDone = async (id, currentStatus) => {
      const tourRef = doc(db, "tours", id);
      const doneDate = !currentStatus ? new Date().toLocaleDateString('de-DE') : null;
      await updateDoc(tourRef, { 
        isDone: !currentStatus,
        doneDate: doneDate
      });
    };

    window.deleteTour = async (id) => {
      if(confirm("Tour wirklich löschen?")) {
        await deleteDoc(doc(db, "tours", id));
      }
    };

    window.editTour = (id) => {
      const tour = allTours.find(t => t.id === id);
      if (!tour) return;
      
      document.getElementById('tourName').value = tour.name;
      document.getElementById('tourRegion').value = tour.region;
      document.getElementById('tourCategory').value = tour.category;
      document.getElementById('tourLink').value = tour.link || '';
      document.getElementById('tourNotes').value = tour.notes || '';
      
      currentEditId = id;
      
      const form = document.getElementById('tourFormContainer');
      form.style.display = 'block';
      document.getElementById('toggleFormBtn').innerText = 'Abbrechen';
      document.getElementById('submitBtn').innerText = 'Änderungen speichern';
      
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.filterTours = () => renderTours();

    function renderTours() {
      const list = document.getElementById('tourList');
      const searchQuery = document.getElementById('searchInput').value.toLowerCase();
      const catFilter = document.getElementById('filterCategory').value;
      const statFilter = document.getElementById('filterStatus').value;

      list.innerHTML = '';

      let filteredTours = allTours.filter(tour => {
        const matchesSearch = tour.name.toLowerCase().includes(searchQuery) || 
                              tour.region.toLowerCase().includes(searchQuery) || 
                              tour.notes.toLowerCase().includes(searchQuery);
        const matchesCat = catFilter === 'all' || tour.category === catFilter;
        const matchesStat = statFilter === 'all' || 
                            (statFilter === 'done' && tour.isDone) || 
                            (statFilter === 'planned' && !tour.isDone);
        
        return matchesSearch && matchesCat && matchesStat;
      });

      if (filteredTours.length === 0) {
        list.innerHTML = '<li style="text-align: center; color: var(--text-muted); padding: 20px;">Keine Touren gefunden.</li>';
        return;
      }

      filteredTours.forEach(tour => {
        const li = document.createElement('li');
        li.className = `tour-item ${tour.isDone ? 'done' : ''}`;
        
        let linkHTML = tour.link ? `<a href="${tour.link}" target="_blank" class="tour-link">Topo ansehen ↗</a>` : '';
        let dateHTML = tour.isDone && tour.doneDate ? `<span>✓ Begangen am ${tour.doneDate}</span>` : '';

        li.innerHTML = `
          <div class="tour-header">
            <h3 class="tour-title">${tour.name}</h3>
            <span class="tour-category">${tour.category}</span>
          </div>
          <div class="tour-meta">
            <span>📍 ${tour.region}</span>
            ${dateHTML}
          </div>
          ${tour.notes ? `<div class="tour-notes">${tour.notes}</div>` : ''}
          ${linkHTML}
          <div class="tour-actions">
            <button class="btn-small" onclick="toggleDone('${tour.id}', ${tour.isDone})">
              ${tour.isDone ? '🔄 Auf Geplant' : '✅ Erledigt'}
            </button>
            <button class="btn-small btn-edit" onclick="editTour('${tour.id}')">✏️ Bearbeiten</button>
            <button class="btn-small btn-delete" onclick="deleteTour('${tour.id}')">🗑 Löschen</button>
          </div>
        `;
        list.appendChild(li);
      });
    }
  </script>
</body>
</html>
